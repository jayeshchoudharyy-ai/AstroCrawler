services:
  - type: web
    name: astrocrawler
    runtime: node
    plan: free
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium && npm run build
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm run start
    healthCheckPath: /api/cron
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DEFAULT_RAZORPAY_LINK
        value: https://pages.razorpay.com/
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: MONITORED_URLS
        sync: false
